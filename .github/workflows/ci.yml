name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: services/engine-py
        run: |
          pip install -r requirements.txt
          pytest -q

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  typescript-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and typecheck
        working-directory: apps/orchestrator-ts
        run: |
          npm ci
          npm run typecheck
